# AdFlow AI — Netlify configuration.
#
# Netlify is the primary visual review environment. The frontend is a normal
# Next.js App Router application; Netlify's Next.js adapter is detected
# automatically and is deliberately NOT overridden here (no publish override,
# no custom redirects that would break nested-route refresh).
#
# The backend (FastAPI, Postgres, Redis, workers, S3) is NOT hosted here. Until
# it is publicly deployed the frontend runs in mock mode and stays fully
# demonstrable — see NEXT_PUBLIC_DEMO_MODE below.

[build]
  base = "frontend"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # Mock mode until a public FastAPI URL exists. To go live against the real
  # backend, set NEXT_PUBLIC_API_BASE_URL in the Netlify UI and flip this to
  # "false" (see README → Netlify environment variables).
  NEXT_PUBLIC_DEMO_MODE = "true"
  NEXT_PUBLIC_APP_ENV = "mock"

# Deploy Previews and branch deploys share the same mock configuration.
[context.deploy-preview.environment]
  NEXT_PUBLIC_DEMO_MODE = "true"
  NEXT_PUBLIC_APP_ENV = "mock"

[context.branch-deploy.environment]
  NEXT_PUBLIC_DEMO_MODE = "true"
  NEXT_PUBLIC_APP_ENV = "mock"

# Demo snapshot + generated media ship with the build.
[[headers]]
  for = "/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

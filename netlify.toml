# AdFlow AI — Netlify configuration.
#
# Netlify is the primary visual review environment. The frontend is a normal
# Next.js App Router application built with the official Next.js Runtime —
# how Next builds is not overridden, and there are no custom redirects that
# would break nested-route refresh.
#
# The backend (FastAPI, Postgres, object storage, FFmpeg) is NOT hosted here —
# it runs on Railway. Production reads its URL and its mode from the Netlify
# UI; previews stay on the bundled snapshot. See [build.environment] below.

[build]
  base = "frontend"
  command = "npm run build"
  # Required. Without it Netlify defaults `publish` to the base directory and
  # ships the raw source tree instead of the build — every route 404s.
  # Relative to `base`, so this is frontend/.next.
  publish = ".next"

# The Next.js Runtime. Framework auto-detection did not attach it on the first
# Git deploy, so it is declared explicitly — this is the official adapter, not
# an override of how Next.js is built.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # NEXT_PUBLIC_DEMO_MODE and NEXT_PUBLIC_APP_ENV are deliberately NOT pinned
  # here for production. A value in this file WINS over the Netlify UI, so
  # while they were pinned to mock the production site kept answering from the
  # bundled snapshot no matter what the UI said — a deploy that looks live and
  # is not. Production now reads both from the UI, alongside
  # NEXT_PUBLIC_API_BASE_URL, which is where the backend URL belongs: it
  # changes when the backend moves, and that should not require a commit.

# Previews and branch deploys stay on the snapshot on purpose: they must never
# be able to spend the production budget or write to the production database.
[context.deploy-preview.environment]
  NEXT_PUBLIC_DEMO_MODE = "true"
  NEXT_PUBLIC_APP_ENV = "mock"

[context.branch-deploy.environment]
  NEXT_PUBLIC_DEMO_MODE = "true"
  NEXT_PUBLIC_APP_ENV = "mock"

# The snapshot changes on every deploy and is the demo's source of truth, so
# it must be revalidated rather than served stale. Getting this wrong shows a
# visitor an old demo indefinitely.
[[headers]]
  for = "/demo/snapshot.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Generated media is addressed by project id, so it never changes under a
# given URL and can be cached hard.
[[headers]]
  for = "/demo/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
